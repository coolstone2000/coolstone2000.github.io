{% if page.categories contains 'Paper_review' and page.paper_venue %}
<div class="paper-meta-box">
  <div class="paper-meta-row">
    <span class="paper-meta-badge venue">{{ page.paper_venue }}</span>
    {% if page.paper_year %}<span class="paper-meta-badge year">{{ page.paper_year }}</span>{% endif %}
  </div>
  {% if page.paper_authors %}
  <div class="paper-meta-authors">
    <i class="fas fa-users" aria-hidden="true"></i>
    <span>{{ page.paper_authors }}</span>
  </div>
  {% endif %}
  {% if page.paper_link %}
  <div class="paper-meta-link">
    <i class="fas fa-file-pdf" aria-hidden="true"></i>
    <a href="{{ page.paper_link }}" target="_blank" rel="noopener">논문 원문 보기</a>
  </div>
  {% endif %}
</div>
{% endif %}

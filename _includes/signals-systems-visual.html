{% unless signals_visual_assets_loaded %}
<link rel="stylesheet" href="{{ '/assets/css/signals-systems.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script defer src="{{ '/assets/js/custom/signals-systems.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
{% assign signals_visual_assets_loaded = true %}
{% endunless %}
<section class="ssv-root" data-kind="{{ include.kind | escape }}" aria-label="{{ include.title | escape }}">
  <header class="ssv-head"><h4>{{ include.title }}</h4><span>그래프와 함께 확인하기</span></header>
  <div class="ssv-body"></div>
  <noscript>대화형 그래프를 보려면 JavaScript를 켜 주세요. 신호의 정의와 계산식은 본문에서 확인할 수 있습니다.</noscript>
</section>

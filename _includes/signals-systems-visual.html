<div class="ssv-root" data-kind="{{ include.kind | default: 'signal-flow' }}">
<style>
.ssv-root{--bg:#fff;--panel:#f8fafc;--border:#dbe4f0;--text:#0f172a;--muted:#475569;--blue:#2563eb;--amber:#d97706;--green:#059669;--red:#dc2626;--purple:#7c3aed;margin:1.7rem 0;padding:16px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,#fff,#f8fafc);color:var(--text)}
.ssv-root.dark{--bg:#0b1220;--panel:#111827;--border:#334155;--text:#e5e7eb;--muted:#94a3b8;--blue:#60a5fa;--amber:#f59e0b;--green:#34d399;--red:#fb7185;--purple:#c084fc;background:linear-gradient(180deg,#111827,#0f172a)}
.ssv-root *{box-sizing:border-box}.ssv-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.ssv-head h4{margin:0;font-size:.96rem}.ssv-head span{font-size:.72rem;color:var(--muted)}.ssv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ssv-panel{padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.ssv-controls{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.ssv-controls label{min-width:140px;flex:1;color:var(--muted);font-size:.75rem}.ssv-controls input,.ssv-controls select{width:100%}.ssv-flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}.ssv-node{padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:.78rem;font-weight:700}.ssv-arrow{color:var(--muted);font-weight:800}.ssv-note{margin-top:8px;color:var(--muted);font-size:.76rem;line-height:1.55}.ssv-canvas{width:100%;display:block;border:1px solid var(--border);border-radius:10px;background:var(--bg)}@media(max-width:820px){.ssv-grid{grid-template-columns:1fr}.ssv-head{flex-direction:column}}
</style>
<div class="ssv-head"><h4>{{ include.title | default: "Signals & Systems Visual" }}</h4><span class="ssv-label"></span></div>
<div class="ssv-body"></div>
<script>
(() => {
document.querySelectorAll('.ssv-root:not([data-ready="1"])').forEach(root=>{
root.dataset.ready="1";
const body=root.querySelector(".ssv-body"),kind=root.dataset.kind;
root.querySelector(".ssv-label").textContent=kind;
const dark=()=>{const h=document.documentElement,b=document.body,s=((h.className||"")+" "+((b&&b.className)||"")+" "+(h.getAttribute("data-theme")||"")+" "+((b&&b.getAttribute("data-theme"))||"")).toLowerCase();return s.includes("dark")||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)};
root.classList.toggle("dark",dark());
const css=()=>getComputedStyle(root),C=n=>css().getPropertyValue(n).trim();
const canvas=(w=640,h=320)=>{const c=document.createElement("canvas");c.width=w;c.height=h;c.className="ssv-canvas";return c};
const clear=(ctx,c)=>{ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle=C("--bg");ctx.fillRect(0,0,c.width,c.height)};
const axes=(ctx,c,x0=48,y0=c.height/2)=>{ctx.strokeStyle=root.classList.contains("dark")?"rgba(226,232,240,.28)":"rgba(51,65,85,.28)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(35,y0);ctx.lineTo(c.width-18,y0);ctx.stroke();ctx.beginPath();ctx.moveTo(x0,16);ctx.lineTo(x0,c.height-28);ctx.stroke()};
const plot=(c,fn,xmin,xmax,ymin,ymax,color="--blue")=>{const ctx=c.getContext("2d");clear(ctx,c);axes(ctx,c);const X=x=>48+(x-xmin)/(xmax-xmin)*(c.width-76),Y=y=>18+(ymax-y)/(ymax-ymin)*(c.height-50);ctx.strokeStyle=C(color);ctx.lineWidth=2.2;ctx.beginPath();for(let i=0;i<=500;i++){const x=xmin+(xmax-xmin)*i/500,y=fn(x),xx=X(x),yy=Y(y);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.stroke()};

if(kind==="signal-flow"){body.innerHTML=`<div class="ssv-flow"><div class="ssv-node">Physical signal</div><div class="ssv-arrow">→</div><div class="ssv-node">Sensor / Mic</div><div class="ssv-arrow">→</div><div class="ssv-node">ADC</div><div class="ssv-arrow">→</div><div class="ssv-node">DSP</div><div class="ssv-arrow">→</div><div class="ssv-node">DAC</div><div class="ssv-arrow">→</div><div class="ssv-node">Output</div></div><div class="ssv-note">같은 정보가 물리량 → 전압 → 숫자 → 처리된 숫자 → 다시 물리량으로 이동한다.</div>`}

if(kind==="ct-dt"){body.innerHTML=`<div class="ssv-grid"><div class="ssv-panel"><b>연속시간</b></div><div class="ssv-panel"><b>샘플</b></div></div><div class="ssv-controls"><label>samples / cycle<input class="r" type="range" min="3" max="30" value="10"></label></div>`;const ps=body.querySelectorAll(".ssv-panel"),c1=canvas(),c2=canvas();ps[0].appendChild(c1);ps[1].appendChild(c2);const draw=()=>{plot(c1,t=>Math.sin(2*Math.PI*t),0,2,-1.3,1.3);const ctx=c2.getContext("2d");clear(ctx,c2);axes(ctx,c2);const r=Number(body.querySelector(".r").value),X=t=>48+t/2*(c2.width-76),Y=y=>c2.height/2-y*c2.height*.34;for(let n=0;n<=2*r;n++){const t=n/r,y=Math.sin(2*Math.PI*t);ctx.strokeStyle=C("--blue");ctx.beginPath();ctx.moveTo(X(t),c2.height/2);ctx.lineTo(X(t),Y(y));ctx.stroke();ctx.fillStyle=C("--blue");ctx.beginPath();ctx.arc(X(t),Y(y),3.3,0,Math.PI*2);ctx.fill()}};body.querySelector(".r").addEventListener("input",draw);draw()}

if(kind==="basic-signals"){body.innerHTML=`<div class="ssv-controls"><label>signal<select class="s"><option value="step">unit step</option><option value="ramp">ramp</option><option value="exp">decaying exponential</option><option value="sin">sinusoid</option></select></label></div>`;const c=canvas();body.appendChild(c);const draw=()=>{const s=body.querySelector(".s").value,f=s==="step"?(x=>x>=0?1:0):s==="ramp"?(x=>x>=0?x:0):s==="exp"?(x=>x>=0?Math.exp(-x):0):(x=>Math.sin(2*Math.PI*x));plot(c,f,-2,3,-1.5,3.2,s==="ramp"?"--amber":"--blue")};body.querySelector(".s").addEventListener("change",draw);draw()}

if(kind==="transform"){body.innerHTML=`<div class="ssv-controls"><label>a<input class="a" type="range" min="-3" max="3" step=".1" value="1"></label><label>b<input class="b" type="range" min="-3" max="3" step=".1" value="0"></label></div><div class="ssv-note">y(t)=x(at-b), x(t)는 삼각펄스</div>`;const c=canvas();body.appendChild(c);const base=x=>Math.abs(x)<=1?1-Math.abs(x):0,draw=()=>plot(c,t=>base(Number(body.querySelector(".a").value)*t-Number(body.querySelector(".b").value)),-4,4,-.2,1.3,"--amber");body.querySelectorAll("input").forEach(e=>e.addEventListener("input",draw));draw()}

if(kind==="convolution"){body.innerHTML=`<div class="ssv-controls"><label>shift t<input class="sh" type="range" min="-2" max="4" step=".02" value="0"></label></div>`;const c=canvas();body.appendChild(c);const draw=()=>{const ctx=c.getContext("2d");clear(ctx,c);axes(ctx,c,48,c.height*.74);const t=Number(body.querySelector(".sh").value),xmin=-2,xmax=4,X=x=>48+(x-xmin)/(xmax-xmin)*(c.width-76),Y=y=>c.height*.74-y*120;const f=x=>(x>=0&&x<=1)?1:0;const lo=Math.max(0,t-1),hi=Math.min(1,t);if(hi>lo){ctx.fillStyle=root.classList.contains("dark")?"rgba(245,158,11,.18)":"rgba(217,119,6,.18)";ctx.fillRect(X(lo),Y(1),X(hi)-X(lo),120)}[[q=>f(q),"--blue"],[q=>f(t-q),"--amber"]].forEach(([fn,cv])=>{ctx.strokeStyle=C(cv);ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=500;i++){const q=xmin+(xmax-xmin)*i/500,xx=X(q),yy=Y(fn(q));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()});ctx.fillStyle=C("--text");ctx.font="14px sans-serif";ctx.fillText("overlap = "+Math.max(0,hi-lo).toFixed(2),58,26)};body.querySelector(".sh").addEventListener("input",draw);draw()}

if(kind==="filter"){body.innerHTML=`<div class="ssv-grid"><div class="ssv-panel"><b>Step response</b></div><div class="ssv-panel"><b>Magnitude response</b></div></div><div class="ssv-controls"><label>RC<input class="rc" type="range" min=".2" max="2" step=".05" value=".7"></label></div>`;const ps=body.querySelectorAll(".ssv-panel"),c1=canvas(),c2=canvas();ps[0].appendChild(c1);ps[1].appendChild(c2);const draw=()=>{const rc=Number(body.querySelector(".rc").value);plot(c1,t=>t>=0?1-Math.exp(-t/rc):0,-1,5,-.1,1.2);plot(c2,w=>1/Math.sqrt(1+(w*rc)*(w*rc)),0,8,-.1,1.2,"--purple")};body.querySelector(".rc").addEventListener("input",draw);draw()}

if(kind==="sampling"){body.innerHTML=`<div class="ssv-controls"><label>samples / cycle<input class="spc" type="range" min="1.5" max="12" step=".1" value="6"></label></div>`;const c=canvas();body.appendChild(c);const draw=()=>{plot(c,t=>Math.sin(2*Math.PI*t),0,3,-1.3,1.3);const ctx=c.getContext("2d"),spc=Number(body.querySelector(".spc").value),X=x=>48+x/3*(c.width-76),Y=y=>c.height/2-y*c.height*.34;for(let n=0;n<=3*spc;n++){const t=n/spc,y=Math.sin(2*Math.PI*t);ctx.fillStyle=C("--red");ctx.beginPath();ctx.arc(X(t),Y(y),3.5,0,Math.PI*2);ctx.fill()}};body.querySelector(".spc").addEventListener("input",draw);draw()}

if(kind==="quantization"){body.innerHTML=`<div class="ssv-controls"><label>bits<input class="bits" type="range" min="2" max="8" value="3"></label></div>`;const c=canvas();body.appendChild(c);const draw=()=>{const B=Number(body.querySelector(".bits").value),L=2**B,ctx=c.getContext("2d");clear(ctx,c);axes(ctx,c);const X=t=>48+t/2*(c.width-76),Y=y=>c.height/2-y*c.height*.34,q=y=>Math.round((y+1)*(L-1)/2)*2/(L-1)-1;[[x=>Math.sin(2*Math.PI*x),"--blue"],[x=>q(Math.sin(2*Math.PI*x)),"--amber"]].forEach(([fn,cv])=>{ctx.strokeStyle=C(cv);ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=500;i++){const t=2*i/500,xx=X(t),yy=Y(fn(t));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()})};body.querySelector(".bits").addEventListener("input",draw);draw()}

if(kind==="dft"){body.innerHTML=`<div class="ssv-grid"><div class="ssv-panel"><b>Time samples</b></div><div class="ssv-panel"><b>DFT magnitude</b></div></div><div class="ssv-controls"><label>bin k<input class="k" type="range" min="1" max="12" value="4"></label></div>`;const ps=body.querySelectorAll(".ssv-panel"),c1=canvas(),c2=canvas();ps[0].appendChild(c1);ps[1].appendChild(c2);const draw=()=>{const N=32,k=Number(body.querySelector(".k").value),a=c1.getContext("2d"),b=c2.getContext("2d");clear(a,c1);clear(b,c2);axes(a,c1,40,c1.height/2);axes(b,c2,40,c2.height-35);const X=n=>40+n/(N-1)*(c1.width-65),Y=y=>c1.height/2-y*90;for(let n=0;n<N;n++){const y=Math.cos(2*Math.PI*k*n/N);a.fillStyle=C("--blue");a.beginPath();a.arc(X(n),Y(y),3,0,Math.PI*2);a.fill()}const BX=q=>40+q/(N-1)*(c2.width-65);for(let q=0;q<N;q++){let re=0,im=0;for(let n=0;n<N;n++){const x=Math.cos(2*Math.PI*k*n/N),th=-2*Math.PI*q*n/N;re+=x*Math.cos(th);im+=x*Math.sin(th)}const m=Math.hypot(re,im);b.strokeStyle=C("--amber");b.beginPath();b.moveTo(BX(q),c2.height-35);b.lineTo(BX(q),c2.height-35-m*5);b.stroke()}};body.querySelector(".k").addEventListener("input",draw);draw()}

if(kind==="window"){body.innerHTML=`<div class="ssv-controls"><label>window<select class="w"><option>rectangular</option><option>hann</option><option>hamming</option><option>blackman</option></select></label></div>`;const c=canvas();body.appendChild(c);const draw=()=>{const type=body.querySelector(".w").value,N=64,f0=7.35,x=[];for(let n=0;n<N;n++){const a=2*Math.PI*n/(N-1);let w=1;if(type==="hann")w=.5-.5*Math.cos(a);if(type==="hamming")w=.54-.46*Math.cos(a);if(type==="blackman")w=.42-.5*Math.cos(a)+.08*Math.cos(2*a);x.push(Math.cos(2*Math.PI*f0*n/N)*w)}const mag=[];for(let k=0;k<N;k++){let re=0,im=0;for(let n=0;n<N;n++){const th=-2*Math.PI*k*n/N;re+=x[n]*Math.cos(th);im+=x[n]*Math.sin(th)}mag.push(Math.hypot(re,im))}const mx=Math.max(...mag),ctx=c.getContext("2d");clear(ctx,c);axes(ctx,c,40,c.height-35);const X=k=>40+k/(N-1)*(c.width-65);ctx.strokeStyle=C("--purple");ctx.beginPath();mag.forEach((m,k)=>{const db=20*Math.log10(Math.max(m/mx,1e-4)),y=c.height-35-(db+80)/80*(c.height-60);k?ctx.lineTo(X(k),y):ctx.moveTo(X(k),y)});ctx.stroke()};body.querySelector(".w").addEventListener("change",draw);draw()}

if(kind==="polezero"){body.innerHTML=`<div class="ssv-controls"><label>pole real part<input class="p" type="range" min="-3" max="1" step=".05" value="-1"></label></div>`;const c=canvas();body.appendChild(c);const draw=()=>{const p=Number(body.querySelector(".p").value),ctx=c.getContext("2d");clear(ctx,c);const cx=c.width/2,cy=c.height/2,s=70;ctx.strokeStyle=C("--muted");ctx.beginPath();ctx.moveTo(20,cy);ctx.lineTo(c.width-20,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,20);ctx.lineTo(cx,c.height-20);ctx.stroke();ctx.strokeStyle=C("--red");ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+p*s-6,cy-6);ctx.lineTo(cx+p*s+6,cy+6);ctx.moveTo(cx+p*s+6,cy-6);ctx.lineTo(cx+p*s-6,cy+6);ctx.stroke();ctx.fillStyle=C("--text");ctx.font="14px sans-serif";ctx.fillText(p<0?"left half-plane → decay":"right half-plane → growth",30,28)};body.querySelector(".p").addEventListener("input",draw);draw()}

if(kind==="correlation"){body.innerHTML=`<div class="ssv-controls"><label>shift k<input class="sh" type="range" min="-12" max="12" value="0"></label></div>`;const c=canvas();body.appendChild(c);const draw=()=>{const sh=Number(body.querySelector(".sh").value),ctx=c.getContext("2d");clear(ctx,c);axes(ctx,c,40,c.height/2);const X=n=>40+(n+12)/24*(c.width-65),Y=y=>c.height/2-y*90,seq=n=>Math.exp(-Math.abs(n)/4);let corr=0;for(let n=-12;n<=12;n++){const a=seq(n),b=seq(n-sh);corr+=a*b;ctx.fillStyle=C("--blue");ctx.beginPath();ctx.arc(X(n),Y(a),2.8,0,Math.PI*2);ctx.fill();ctx.fillStyle=C("--amber");ctx.beginPath();ctx.arc(X(n),Y(b),2.8,0,Math.PI*2);ctx.fill()}ctx.fillStyle=C("--text");ctx.font="14px sans-serif";ctx.fillText("correlation ≈ "+corr.toFixed(3),50,28)};body.querySelector(".sh").addEventListener("input",draw);draw()}
});
})();
</script>
</div>

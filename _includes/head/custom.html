<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  document.addEventListener('DOMContentLoaded', async function() {
    const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        fontFamily: 'Pretendard, sans-serif',
        fontSize: '16px',
        primaryColor: isDarkMode ? '#2d3340' : '#ffffff',
        primaryBorderColor: isDarkMode ? '#888888' : '#333333',
        primaryTextColor: isDarkMode ? '#ffffff' : '#111111',
        lineColor: isDarkMode ? '#aaaaaa' : '#555555',
        edgeLabelBackground: isDarkMode ? '#252a34' : '#f2f2f2',
        tertiaryColor: isDarkMode ? '#252a34' : '#ffffff'
      }
    });
    await mermaid.run({ querySelector: '.language-mermaid' });
  });
</script>

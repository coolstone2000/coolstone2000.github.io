<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"><style>text{font-family:Arial,sans-serif;fill:#eaeaea;font-size:17px}.small{font-size:14px;fill:#b6c1cd}.title{font-size:21px;font-weight:bold}.axis{stroke:#748191;stroke-width:1}.grid{stroke:#394454;stroke-width:1}.line{fill:none;stroke:#8cced2;stroke-width:3}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8cced2"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f2bb72"/></marker></defs><rect width="900" height="380" rx="14" fill="#252a34"/><text x="30" y="35" class="title">Line integrals: the path and its orientation matter</text><path d="M85,300 L365,300" fill="none" stroke="#748191" stroke-width="3"/><path d="M85,300 L85,70" fill="none" stroke="#748191" stroke-width="3"/><path d="M110,275 L310,75" fill="none" stroke="#8cced2" stroke-width="3" marker-end="url(#a)"/><path d="M110,275 L310,275" fill="none" stroke="#f2bb72" stroke-width="3" marker-end="url(#b)"/><path d="M310,275 L310,75" fill="none" stroke="#f2bb72" stroke-width="3" marker-end="url(#b)"/><text x="85" y="325" class="">A (0,0)</text><text x="310" y="65" class="">B (1,1)</text><text x="135" y="165" class="">C₁</text><text x="245" y="310" class="">C₂</text><text x="455" y="115" class="">F = (-y,x,0)</text><text x="455" y="165" class="">C₁: diagonal → integral = 0</text><text x="455" y="215" class="">C₂: right, then up → integral = 1</text><text x="455" y="270" class="">Same endpoints do not imply equal work.</text><text x="455" y="310" class="small">Reversing the path changes the sign.</text></svg>
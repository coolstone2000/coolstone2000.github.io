<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"><style>text{font-family:Arial,sans-serif;fill:#eaeaea;font-size:17px}.small{font-size:14px;fill:#b6c1cd}.title{font-size:21px;font-weight:bold}.axis{stroke:#748191;stroke-width:1}.grid{stroke:#394454;stroke-width:1}.line{fill:none;stroke:#8cced2;stroke-width:3}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8cced2"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f2bb72"/></marker></defs><rect width="900" height="380" rx="14" fill="#252a34"/><text x="30" y="35" class="title">Gradient is perpendicular to level curves</text><ellipse cx="255" cy="215" rx="45" ry="31.819805153394636" fill="none" stroke="#536979" stroke-width="2"/><ellipse cx="255" cy="215" rx="85" ry="60.104076400856535" fill="none" stroke="#536979" stroke-width="2"/><ellipse cx="255" cy="215" rx="125" ry="88.38834764831843" fill="none" stroke="#536979" stroke-width="2"/><ellipse cx="255" cy="215" rx="165" ry="116.67261889578033" fill="none" stroke="#536979" stroke-width="2"/><path d="M255,215 L465,215" fill="none" stroke="#748191" stroke-width="3"/><path d="M255,330 L255,75" fill="none" stroke="#748191" stroke-width="3"/><circle cx="320" cy="150" r="5" fill="#f2bb72"/><path d="M320,150 L355,80" fill="none" stroke="#8cced2" stroke-width="3" marker-end="url(#a)"/><path d="M280,130 L375,177" fill="none" stroke="#f2bb72" stroke-width="3"/><text x="370" y="90" class="">∇f</text><text x="333" y="140" class="">P</text><text x="505" y="125" class="">f(x,y) = x² + 2y²</text><text x="505" y="175" class="">At P = (1,1): ∇f = (2,4)</text><text x="505" y="225" class="">Along a contour: change = 0</text><text x="505" y="275" class="">Across contours: f increases fastest</text></svg>
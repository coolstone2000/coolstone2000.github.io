<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"><style>text{font-family:Arial,sans-serif;fill:#eaeaea;font-size:17px}.small{font-size:14px;fill:#b6c1cd}.title{font-size:21px;font-weight:bold}.axis{stroke:#748191;stroke-width:1}.grid{stroke:#394454;stroke-width:1}.line{fill:none;stroke:#8cced2;stroke-width:3}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8cced2"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f2bb72"/></marker></defs><rect width="900" height="380" rx="14" fill="#252a34"/><text x="30" y="35" class="title">Projection: keep one direction, remove the overlap</text><path d="M80,300 L410,300" fill="none" stroke="#748191" stroke-width="3"/><path d="M80,300 L80,65" fill="none" stroke="#748191" stroke-width="3"/><path d="M80,300 L320,100" fill="none" stroke="#8cced2" stroke-width="3" marker-end="url(#a)"/><path d="M80,300 L320,300" fill="none" stroke="#f2bb72" stroke-width="3" marker-end="url(#b)"/><path d="M320,300 L320,100" fill="none" stroke="#8cced2" stroke-width="3" marker-end="url(#a)"/><text x="230" y="110" class="">v</text><text x="130" y="330" class="">projection onto u</text><text x="330" y="195" class="">residual</text><text x="390" y="290" class="">u</text><text x="490" y="115" class="">v = parallel part + perpendicular part</text><text x="490" y="170" class="">Gram–Schmidt removes the parallel part.</text><text x="490" y="215" class="">Least squares uses the same geometry.</text><text x="490" y="265" class="small">The residual is perpendicular to the subspace.</text></svg>
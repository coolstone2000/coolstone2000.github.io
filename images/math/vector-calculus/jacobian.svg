<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"><style>text{font-family:Arial,sans-serif;fill:#eaeaea;font-size:17px}.small{font-size:14px;fill:#b6c1cd}.title{font-size:21px;font-weight:bold}.axis{stroke:#748191;stroke-width:1}.grid{stroke:#394454;stroke-width:1}.line{fill:none;stroke:#8cced2;stroke-width:3}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8cced2"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f2bb72"/></marker></defs><rect width="900" height="380" rx="14" fill="#252a34"/><text x="30" y="35" class="title">Polar area: the angular edge gets longer with radius</text><path d="M100,305 L385,185 A310,310 0 0 0 319,86 Z" fill="#31434c" stroke="#536979" stroke-width="2"/><path d="M280,229 L345,201 A266,266 0 0 0 288,118 L238,171 A196,196 0 0 1 280,229" fill="#497079" stroke="#8cced2" stroke-width="2"/><text x="100" y="330" class="">origin</text><text x="287" y="250" class="">dr</text><text x="339" y="149" class="">r dθ</text><text x="145" y="260" class="">dθ</text><text x="485" y="130" class="">Small area ≈ dr × (r dθ)</text><text x="485" y="185" class="">dA = r dr dθ</text><text x="485" y="245" class="">The factor r is the Jacobian.</text><text x="485" y="300" class="small">In spherical coordinates: r² sinθ</text></svg>
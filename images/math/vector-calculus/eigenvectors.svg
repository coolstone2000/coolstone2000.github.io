<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"><style>text{font-family:Arial,sans-serif;fill:#eaeaea;font-size:17px}.small{font-size:14px;fill:#b6c1cd}.title{font-size:21px;font-weight:bold}.axis{stroke:#748191;stroke-width:1}.grid{stroke:#394454;stroke-width:1}.line{fill:none;stroke:#8cced2;stroke-width:3}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8cced2"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f2bb72"/></marker></defs><rect width="900" height="380" rx="14" fill="#252a34"/><text x="30" y="35" class="title">A matrix stretches its eigenvector directions</text><text x="80" y="75" class="">Before</text><path d="M50,240 L330,240" fill="none" stroke="#748191" stroke-width="3"/><path d="M170,335 L170,95" fill="none" stroke="#748191" stroke-width="3"/><path d="M170,240 L210,200" fill="none" stroke="#8cced2" stroke-width="3" marker-end="url(#a)"/><path d="M170,240 L235,305" fill="none" stroke="#f2bb72" stroke-width="3" marker-end="url(#b)"/><text x="215" y="190" class="">v₁</text><text x="240" y="310" class="">v₂</text><text x="520" y="75" class="">After: A = [[2,1],[1,2]]</text><path d="M490,240 L770,240" fill="none" stroke="#748191" stroke-width="3"/><path d="M610,335 L610,95" fill="none" stroke="#748191" stroke-width="3"/><path d="M610,240 L730,120" fill="none" stroke="#8cced2" stroke-width="3" marker-end="url(#a)"/><path d="M610,240 L675,305" fill="none" stroke="#f2bb72" stroke-width="3" marker-end="url(#b)"/><text x="655" y="135" class="">3v₁</text><text x="680" y="310" class="">v₂</text><text x="335" y="190" class="">A →</text><text x="30" y="365" class="small">One eigendirection grows by 3; the other stays unchanged.</text></svg>